name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create and publish a GitHub release
        required: false
        default: false
        type: boolean
      version:
        description: Optional version, for example 2.0.0
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set requested version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build NSIS installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TpF2-Modmanager-windows
          path: dist-electron/TpF2-Modmanager-Setup-*.exe
          if-no-files-found: error
      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "2.0.0" }
          $tag = "v$version"
          $asset = (Get-ChildItem "dist-electron/TpF2-Modmanager-Setup-*.exe" | Select-Object -First 1).FullName
          if (gh release view $tag 2>$null) { gh release upload $tag $asset --clobber }
          else { gh release create $tag $asset --title "TpF2 Modmanager $tag" --generate-notes }
