name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create and publish a GitHub release after a successful manual build"
        required: false
        default: false
        type: boolean
      version:
        description: "Optional version for tag/release name, e.g. 1.2.3"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TpF2-Modmanager-windows
            binary_path: dist/TpF2-Modmanager.exe
          - os: ubuntu-latest
            artifact_name: TpF2-Modmanager-linux
            binary_path: dist/TpF2-Modmanager

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (-not (Test-Path "requirements.txt")) {
            throw "requirements.txt is missing"
          }

          python -m pip install -r requirements.txt

          python -m pip install PyInstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean app.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path '${{ matrix.binary_path }}')) {
            throw "Expected build output not found: ${{ matrix.binary_path }}"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

  release:
    needs: pyinstaller
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Determine release metadata
        id: release_meta
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "manual-${{ github.run_number }}"
          }

          $tag = "v$version"
          $releaseName = "TpF2-Modmanager $tag"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          title="${{ steps.release_meta.outputs.release_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title"
          else
            gh release create "$tag" \
              --title "$title" \
              --notes "Automated release created from workflow run #${{ github.run_number }}."
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release_meta.outputs.tag }}" \
            "release-assets/TpF2-Modmanager-windows/TpF2-Modmanager.exe" \
            "release-assets/TpF2-Modmanager-linux/TpF2-Modmanager" \
            --clobber
