name: Build

on:
  push:
  workflow_dispatch:

jobs:
  pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TpF2-Modmanager-windows
            binary_path: dist/TpF2-Modmanager.exe
            data_sep: ";"
            icon_path: media/icon.ico
          - os: ubuntu-latest
            artifact_name: TpF2-Modmanager-linux
            binary_path: dist/TpF2-Modmanager
            data_sep: ":"
            icon_path: media/icon.png

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          python -m pip install PyInstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $dataSep = '${{ matrix.data_sep }}'
          $iconPath = '${{ matrix.icon_path }}'

          $args = @(
            '--noconfirm'
            '--clean'
            '--onefile'
            '--windowed'
            '--name'
            'TpF2-Modmanager'
            '--add-data'
            "resources${dataSep}resources"
            '--add-data'
            "media${dataSep}media"
            'app.py'
          )

          if (Test-Path $iconPath) {
            $args += @('--icon', $iconPath)
          }

          python -m PyInstaller @args

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error